[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:nextjs]
command=node /app/frontend/.next/standalone/server.js
directory=/app/frontend/.next/standalone
environment=PORT="3000",HOSTNAME="0.0.0.0",DB_PATH="/app/data/checkin.db"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5

[program:worker]
command=python3 -u /app/worker/worker.py
directory=/app/worker
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
